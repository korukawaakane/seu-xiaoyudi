<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#8c1d1d" />
    <title>内容管理｜SEU“小雨滴”社会实践团</title>
    <style>
      :root { color: #2d2926; background: #f7f0e4; font-family: "Noto Serif SC", "Songti SC", serif; }
      body { min-height: 100vh; margin: 0; }
      .cms-loading { box-sizing: border-box; display: grid; min-height: 100vh; place-items: center; padding: 24px; }
      .cms-loading__card { width: min(100%, 540px); border: 1px solid #d9c9b2; border-top: 5px solid #8c1d1d; background: #fffaf2; box-shadow: 0 18px 42px rgb(63 38 25 / 12%); padding: 32px; }
      .cms-loading__eyebrow { color: #8c1d1d; font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
      .cms-loading h1 { margin: 12px 0 10px; color: #542020; font-size: clamp(24px, 5vw, 34px); }
      .cms-loading p { margin: 0; color: #6e6258; line-height: 1.8; }
      .cms-section-heading { margin: 28px 0 10px; border-left: 4px solid #8c1d1d; background: #f7f0e4; padding: 10px 14px; }
      .cms-section-heading h2 { margin: 0; color: #542020; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 18px; }
      .cms-section-heading p { margin: 4px 0 0; color: #6e6258; font: 14px/1.6 system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <main class="cms-loading" aria-live="polite">
      <section class="cms-loading__card">
        <p class="cms-loading__eyebrow">SEU RAINDROP ARCHIVE</p>
        <h1>正在加载内容管理后台</h1>
        <p>请稍候。首次启用前，请完成仓库与 GitHub OAuth 配置。</p>
      </section>
    </main>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@3.14.1/dist/decap-cms.js"></script>
    <script>
      (function () {
        var SectionHeading = window.createClass({
          render: function () {
            var field = this.props.field;
            return window.h(
              "section",
              { className: "cms-section-heading", "aria-label": field.get("label") },
              window.h("h2", null, field.get("label")),
              field.get("hint") ? window.h("p", null, field.get("hint")) : null
            );
          }
        });

        window.CMS.registerWidget("section-heading", SectionHeading);
        window.initCMS();
      })();
    </script>
  </body>
</html>
